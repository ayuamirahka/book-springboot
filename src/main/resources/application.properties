spring.application.name=pinjam-buku-bce
server.port=8080

# Database H2 in-memory (hilang saat aplikasi dimatikan)
spring.datasource.url=jdbc:h2:mem:perpustakaan;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Skema dibuat dari schema.sql, lalu diuji validasi oleh Hibernate
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
